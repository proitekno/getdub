[package]
name = "getdub"
version = "0.0.51"
edition = "2021"
description = "Fast duplicate file finder with persistent index"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
walkdir = "2.5"
glob = "0.3"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
memmap2 = "0.9"
mft = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

